name: Build & publish keeper board

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Build the board (fetches current ESPN rosters)
        run: python build_board.py

      - name: Persist season-end snapshots so they can never drift
        run: |
          NEW=$(git status --porcelain | grep -E 'standings_lock_.*\.json|keeper_snapshot_.*\.json' | wc -l)
          if [ "$NEW" -gt 0 ]; then
            git config user.name "108-stitches-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add standings_lock_*.json keeper_snapshot_*.json
            git commit -m "Freeze season-end snapshots [skip ci]"
            git push || echo "push failed; snapshots also published to Pages and will retry next build"
          else
            echo "No new season-end snapshots to persist."
          fi
      - name: Stage the site
        run: |
          mkdir -p _site
          cp "108-stitches-keeper-board.html" _site/index.html
          cp manifest.webmanifest _site/
          cp sw.js _site/
          cp -r icons _site/icons
          cp auction-players.json _site/ 2>/dev/null || true
          cp standings_lock_*.json _site/ 2>/dev/null || true
          cp keeper_snapshot_*.json _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
